# XcodeGen: maakt DartsCaller.xcodeproj automatisch aan (op de Mac van GitHub Actions).
name: DartsCaller
options:
  bundleIdPrefix: be.liam
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DartsCaller:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Vision
      - Audio
      - Views
      - path: Models/DartsYOLO.mlpackage
        type: file
        buildPhase: sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: DartsCaller
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: DartsCaller gebruikt de camera om je pijlen automatisch te scoren.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.liam.dartscaller
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
